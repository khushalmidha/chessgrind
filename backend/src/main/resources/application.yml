spring:
  application:
    name: mateforge-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mateforge}
    username: ${DATABASE_USERNAME:mateforge}
    password: ${DATABASE_PASSWORD:mateforge}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-to-a-64-byte-production-secret-key}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  engine:
    stockfish-path: ${STOCKFISH_PATH:stockfish}
    move-time-ms: ${STOCKFISH_MOVE_TIME_MS:250}
    line-depth: ${STOCKFISH_LINE_DEPTH:14}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:120}
