spring:
  application:
    name: mateforge-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mateforge}
    username: ${DATABASE_USERNAME:mateforge}
    password: ${DATABASE_PASSWORD:mateforge}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-to-a-64-byte-production-secret-key}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  engine:
    stockfish-path: ${STOCKFISH_PATH:stockfish}
    move-time-ms: ${STOCKFISH_MOVE_TIME_MS:80}
    line-depth: ${STOCKFISH_LINE_DEPTH:10}
    threads: ${STOCKFISH_THREADS:1}
    hash-mb: ${STOCKFISH_HASH_MB:32}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:120}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
